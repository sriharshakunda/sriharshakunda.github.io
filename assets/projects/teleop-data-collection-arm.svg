<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)" />
  <rect width="800" height="450" fill="url(#grid2)" />
  
  <g transform="translate(140, 60)">
    <!-- Kinematic Links -->
    <circle cx="100" cy="260" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <line x1="100" y1="260" x2="220" y2="150" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    <circle cx="220" cy="150" r="16" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
    <line x1="220" y1="150" x2="360" y2="170" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <circle cx="360" cy="170" r="14" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
    <line x1="360" y1="170" x2="440" y2="120" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
    <circle cx="440" cy="120" r="10" fill="#1e293b" stroke="#fcd34d" stroke-width="2"/>
    <!-- Handle -->
    <path d="M 440 120 L 480 140 L 490 200" stroke="#fcd34d" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="490" cy="200" r="12" fill="#ef4444"/>

    <!-- Encoder Indicators -->
    <circle cx="100" cy="260" r="6" fill="#38bdf8"/>
    <circle cx="220" cy="150" r="6" fill="#38bdf8"/>
    <circle cx="360" cy="170" r="6" fill="#38bdf8"/>
    <circle cx="440" cy="120" r="5" fill="#38bdf8"/>
  </g>

  <!-- Typography -->
  <text x="50" y="380" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">6-DOF Teleoperation Data Collection Arm</text>
  <text x="50" y="410" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">Counterbalanced Kinematics • 14-bit AS5048A Encoders • 200Hz Low Latency</text>
  <rect x="680" y="30" width="90" height="24" rx="4" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1"/>
  <text x="725" y="46" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">MECHANICAL</text>
</svg>

