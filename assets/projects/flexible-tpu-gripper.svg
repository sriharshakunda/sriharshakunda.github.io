<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b15" />
      <stop offset="100%" stop-color="#0f291e" />
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)" />
  <rect width="800" height="450" fill="url(#grid3)" />
  
  <g transform="translate(180, 50)">
    <!-- Base mounting -->
    <rect x="180" y="240" width="80" height="20" rx="4" fill="#334155" stroke="#10b981" stroke-width="2"/>
    <!-- Compliant Finger Left -->
    <path d="M 190 240 Q 150 160 170 80 Q 200 130 200 240 Z" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="3"/>
    <!-- Internal ribs Left -->
    <line x1="175" y1="200" x2="195" y2="200" stroke="#34d399" stroke-width="2"/>
    <line x1="163" y1="160" x2="190" y2="160" stroke="#34d399" stroke-width="2"/>
    <line x1="165" y1="120" x2="185" y2="120" stroke="#34d399" stroke-width="2"/>

    <!-- Compliant Finger Right -->
    <path d="M 250 240 Q 290 160 270 80 Q 240 130 240 240 Z" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="3"/>
    <!-- Internal ribs Right -->
    <line x1="265" y1="200" x2="245" y2="200" stroke="#34d399" stroke-width="2"/>
    <line x1="277" y1="160" x2="250" y2="160" stroke="#34d399" stroke-width="2"/>
    <line x1="275" y1="120" x2="255" y2="120" stroke="#34d399" stroke-width="2"/>

    <!-- Grasped object -->
    <circle cx="220" cy="110" r="30" fill="#38bdf8" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="50" y="380" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">Monolithic Flexible TPU Robot Gripper</text>
  <text x="50" y="410" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">95A Shore Elastomer • Fin-Ray Compliant Truss • Topology Optimized</text>
  <rect x="680" y="30" width="90" height="24" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
  <text x="725" y="46" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">MECHANICAL</text>
</svg>

